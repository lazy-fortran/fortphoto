name = "fortphoto"
version = "0.0.1"
license = "MIT"
author = "Christopher Albert"
maintainer = "albert@tugraz.at"
copyright = "Copyright 2026, Christopher Albert"
description = "Photo printing with an exact preview: fill and crop or fit, borderless"

[build]
auto-executables = true
auto-tests = true

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[preprocess]
cpp.suffixes = ["f90"]

[dependencies]
fortui = { git = "https://github.com/lazy-fortran/fortui.git", rev = "c7a2fb31ec79f7f1ada06aa30efe71e8068b90a6" }
fortimg = { git = "https://github.com/lazy-fortran/fortimg.git", rev = "22716c3ed5424e1e463bde5e6bc0daf40d78cb2e" }
